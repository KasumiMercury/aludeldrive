name: app

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: changes
        run: >-
          scripts/changed.sh
          app ':!app/src-tauri' mise.toml
          .github/workflows/app.yml scripts/changed.sh
      - if: steps.changes.outputs.run == 'true'
        uses: jdx/mise-action@v3
        with:
          install_args: node pnpm
      - if: steps.changes.outputs.run == 'true'
        id: pnpm
        working-directory: app
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - if: steps.changes.outputs.run == 'true'
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm build

  app-tauri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: changes
        run: >-
          scripts/changed.sh
          app/src-tauri Cargo.toml Cargo.lock mise.toml
          .github/workflows/app.yml scripts/changed.sh
      - if: steps.changes.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - if: steps.changes.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.changes.outputs.run == 'true'
        run: |
          cargo fmt -p aludel-app --check
          cargo clippy -p aludel-app --all-targets -- -D warnings
          cargo test -p aludel-app
