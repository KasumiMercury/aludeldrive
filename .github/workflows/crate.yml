name: crate

on:
  pull_request:

permissions:
  contents: read

jobs:
  crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: changes
        run: >-
          scripts/changed.sh
          crates Cargo.toml Cargo.lock proto buf.yaml mise.toml
          .github/workflows/crate.yml scripts/changed.sh
      - if: steps.changes.outputs.run == 'true'
        uses: jdx/mise-action@v3
        with:
          install_args: buf
      - if: steps.changes.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.changes.outputs.run == 'true'
        run: |
          cargo fmt -p aludel-api -p aludel-cli --check
          cargo clippy -p aludel-api -p aludel-cli --all-targets -- -D warnings
          cargo test -p aludel-api -p aludel-cli
