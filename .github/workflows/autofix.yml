name: autofix.ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: app
        run: >-
          scripts/changed.sh
          app ':!app/src-tauri' mise.toml
          .github/workflows/autofix.yml scripts/changed.sh
      - id: rust
        run: >-
          scripts/changed.sh
          crates app/src-tauri Cargo.toml
          .github/workflows/autofix.yml scripts/changed.sh
      - id: go
        run: >-
          scripts/changed.sh
          server go.work mise.toml
          .github/workflows/autofix.yml scripts/changed.sh
      - if: steps.app.outputs.run == 'true'
        uses: jdx/mise-action@v3
        with:
          install_args: node pnpm
      - if: steps.app.outputs.run == 'true'
        id: pnpm
        working-directory: app
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - if: steps.app.outputs.run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - if: steps.app.outputs.run == 'true'
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm fmt
      - if: steps.rust.outputs.run == 'true'
        run: cargo fmt --all
      - if: steps.go.outputs.run == 'true'
        uses: jdx/mise-action@v3
        with:
          install_args: go golangci-lint
      - if: steps.go.outputs.run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ hashFiles('server/go.sum', 'mise.toml') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('server/go.sum', 'mise.toml') }}-
            go-${{ runner.os }}-
      - if: steps.go.outputs.run == 'true'
        working-directory: server
        run: |
          golangci-lint run --fix --issues-exit-code=0 ./...
          golangci-lint fmt
      - if: github.event_name == 'pull_request'
        uses: autofix-ci/action@v1
