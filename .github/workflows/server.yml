name: server

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: changes
        run: >-
          scripts/changed.sh
          server proto buf.yaml buf.gen.yaml go.work mise.toml
          .github/workflows/server.yml scripts/changed.sh
      - if: steps.changes.outputs.run == 'true'
        uses: jdx/mise-action@v3
        with:
          install_args: >-
            go buf golangci-lint
            go:google.golang.org/protobuf/cmd/protoc-gen-go
            go:connectrpc.com/connect/v2/cmd/protoc-gen-connect-go
      - if: steps.changes.outputs.run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ hashFiles('server/go.sum', 'mise.toml') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('server/go.sum', 'mise.toml') }}-
            go-${{ runner.os }}-
      - if: steps.changes.outputs.run == 'true'
        run: |
          buf lint
          buf format --diff --exit-code
          buf generate
          test -z "$(git status --porcelain)"
      - if: steps.changes.outputs.run == 'true'
        working-directory: server
        run: |
          golangci-lint fmt --diff
          golangci-lint run ./...
          go test ./...
      - if: steps.changes.outputs.run == 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ hashFiles('server/go.sum', 'mise.toml') }}-${{ github.run_id }}
