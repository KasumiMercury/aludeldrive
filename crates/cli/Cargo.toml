[package]
name = "aludel-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aludel-api = { path = "../api" }
connectrpc = { version = "0.9", features = ["client-tls"] }
http = "1"
rustls-platform-verifier = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
